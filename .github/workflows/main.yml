name: Build_Android_2025
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Sửa đường dẫn ở đây: thêm Source code/Source code/ vào trước gradlew
      - name: Grant execute permission
        run: chmod +x "Source code/gradlew"

      - name: Build with Gradle
        # Phải chui vào thư mục đó rồi mới chạy lệnh build
        run: |
          cd "Source code"
          ./gradlew assembleDebug

      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: App_Android_Moi_Nhat
          path: "Source code/app/*.apk"
