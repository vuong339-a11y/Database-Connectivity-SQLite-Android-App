name: Build_Android_APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        # Android hiện đại thường yêu cầu Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        # Cấp quyền chạy cho file build của Android
        run: chmod +x gradlew

      - name: Build with Gradle
        # Lệnh này sẽ tạo ra file APK bản dùng thử (Debug)
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ung_Dung_Android
          # Đường dẫn mặc định nơi file APK sinh ra
          path: app/build/outputs/apk/debug/*.apk
